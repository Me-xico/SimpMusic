name: PR check
# Compiles Android and Desktop and runs the JVM tests. Needs no secrets, so it
# works for pull requests from forks; the signed release build stays in android.yml.
on:
  workflow_dispatch:
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
      - '.github/FUNDING.yml'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Compile Android (debug, FOSS)
        run: ./gradlew androidApp:assembleDebug

      - name: Compile Desktop
        run: ./gradlew desktopApp:jvmMainClasses

      - name: Run JVM tests
        run: ./gradlew domain:jvmTest listenTogether:jvmTest
